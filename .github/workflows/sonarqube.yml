# SonarQube analysis for Vehicle Dynamics (Python).
# Secrets required: SONAR_TOKEN, SONAR_HOST_URL

name: SonarQube analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run tests (optional coverage later)
        run: pytest -q || true

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=Leneord1_VDS
            -Dsonar.projectName=VehicleDynamics
            -Dsonar.sources=.
            -Dsonar.exclusions=**/.venv/**,**/__pycache__/**,**/.idea/**,**/documentation/**
            -Dsonar.python.version=3.12
